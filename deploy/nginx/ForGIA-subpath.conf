# ForGIA 뷰어를 80 포트의 /ForGIA/ 아래에 얹는다.
#
# 왜 필요한가: 사내 VPN 이 80 만 통과시킨다. :9090 은 사내망 안에서는 되는데
# VPN 으로 붙으면 안 된다. 그런데 이 머신의 80 은 phyloserver 블록이
# `server_name 172.16.116.98` 로 이미 잡고 있다.
#
# 호스트명 기반 vhost(forgia.paleolab 같은 것)로 가르는 방법도 있지만, VPN 사용자가
# **IP 로 들어오므로** Host 헤더가 172.16.116.98 이라 그 블록에 걸리지 않는다.
# 각자 hosts 파일을 고쳐야 해서 실효성이 없다. 그래서 서브경로로 얹는다.
#
# DiaRUGA 와 같은 phyloserver 블록에 조각으로 얹힌다 — 둘이 나란히 산다.
#
# 설치:
#   sudo cp deploy/nginx/ForGIA-subpath.conf /etc/nginx/snippets/ForGIA-subpath.conf
#   # /etc/nginx/sites-enabled/phyloserver 의 server 블록 안에 한 줄 넣는다:
#   #     include snippets/ForGIA-subpath.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# phyloserver 블록의 `location ~ ^/(phylomanager|...)` 정규식보다 **접두 location 이
# 먼저 잡히지 않는다** — nginx 는 정규식을 먼저 본다. 다만 그 정규식에 ForGIA 가
# 없으므로 부딪히지 않는다. `location /` 의 try_files 보다는 더 긴 접두인 이 블록이
# 이긴다.

# --- 점검 안내 -------------------------------------------------------------
#
# 컨테이너를 갈아 끼우는 5~30초 동안 nginx 는 맨 502 를 낸다. 사람이 보기에는
# 고장과 구별되지 않는다. deploy.sh 가 maintenance.flag 를 세우고 trap 으로
# 지우므로(.guides/web/deployment.md §5·§6), nginx 가 그 파일을 보고 안내를 낸다.
#
# **`error_page 503 = /…` 처럼 `=` 를 쓰면 안 된다.** 상태를 200 으로 바꿔 버려서
# 크롤러도 스크립트도 정상으로 읽는다. URI 만 주고 `internal` 로 직접 접근을 막는다.
location = /ForGIA-maintenance.html {
    internal;
    root /srv/ForGIA/www;
    # 안내 페이지를 캐시하면 끝난 뒤에도 그것이 보인다
    add_header Cache-Control "no-store" always;
}
location = /ForGIA-unavailable.html {
    internal;
    root /srv/ForGIA/www;
    add_header Cache-Control "no-store" always;
}

# 뿌리로 들어오면 슬래시를 붙여 보낸다. 이게 없으면 Django 가 /ForGIA 를 못 찾는다.
location = /ForGIA {
    return 301 /ForGIA/;
}

# 대소문자를 틀리게 친 주소를 정식 주소로 보낸다 (DiaRUGA 048 과 같은 갈래).
#
# **URL 은 대소문자를 가린다.** 정식 이름이 `ForGIA` 라 `/forgia/` 로 친 사람은
# 그냥 두면 404 를 본다.
#
# 이 블록이 정식 주소까지 잡아채면 무한 루프가 된다 — nginx 는 **접두 location 보다
# 정규식을 먼저 보기 때문이다.** 그래서 아래 /ForGIA/ 블록에 `^~` 를 붙였다.
# `^~` 는 접두가 맞으면 정규식을 아예 보지 말라는 뜻이다. `= /ForGIA` 쪽은
# 정확히 일치라 정규식보다 우선순위가 높아 따로 막을 것이 없다.
location ~* ^/(forgia)(/.*)?$ {
    return 301 /ForGIA$2;
}

location ^~ /ForGIA/ {
    # 배포가 세운 깃발이 있으면 안내부터. proxy_pass 보다 먼저 본다.
    if (-f /srv/ForGIA/maintenance.flag) { return 503; }
    error_page 503 /ForGIA-maintenance.html;

    # 깃발이 없는데 뷰어가 안 받으면 진짜로 멈춘 것이다 — 다른 안내를 낸다.
    # "점검 중" 이라고 하면 거짓말이 된다.
    error_page 502 504 /ForGIA-unavailable.html;
    proxy_intercept_errors on;

    # **끝의 슬래시가 핵심이다.** 이것이 있어야 nginx 가 /ForGIA/ 을 떼고 넘긴다.
    # Django 는 뿌리(/)에 붙은 것처럼 URL 을 해석하고, 링크를 만들 때만
    # FORCE_SCRIPT_NAME=/ForGIA 을 앞에 붙인다. 슬래시를 빼면 앱이 /ForGIA/... 을
    # 그대로 받아 전부 404 가 된다.
    proxy_pass http://127.0.0.1:8091/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 큰 원본을 줄여 내보내는 요청이 있어 기본 60초로는 모자랄 때가 있다
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # 교정 저장(POST /review)은 폴리곤이 실려 커질 수 있다
    client_max_body_size 32m;

    # 썸네일이 줄줄이 나가므로 버퍼링을 켜 둔다 (기본값이지만 명시한다)
    proxy_buffering on;
}
