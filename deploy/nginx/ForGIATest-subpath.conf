# ForGIA **테스트 인스턴스**를 80 포트의 /ForGIATest/ 아래에 얹는다.
#
# 왜 서브경로인가: 운영(`ForGIA-subpath.conf`)과 같은 이유다 — 사내 VPN 이 80 만
# 통과시킨다. 포트를 하나 더 여는 길은 없다.
#
# 설치:
#   sudo cp deploy/nginx/ForGIATest-subpath.conf /etc/nginx/snippets/
#   # /etc/nginx/sites-enabled/phyloserver 의 server 블록 안,
#   # `include snippets/ForGIA-subpath.conf;` 바로 아래에 한 줄 넣는다:
#   #     include snippets/ForGIATest-subpath.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# 뒤에 있는 것:
#   127.0.0.1:8091  ← /srv/ForGIA/test/docker-compose.yml (프로젝트 forgia-test)
#   DB 는 **사본**이다 (/srv/ForGIA/test/db/). 운영 DB 를 물리지 않는다.
#
# **운영의 유지보수 안내(maintenance.flag)를 여기 옮겨 오지 않았다.** 테스트는
# `deploy.sh` 가 아니라 손으로 올리고 내리므로 깃발을 세우는 쪽이 없다. 깃발이
# 없는데 안내를 내면 거짓말이 된다 — 안 받으면 502 를 그대로 보여 준다.

# 뿌리로 들어오면 슬래시를 붙여 보낸다. 없으면 Django 가 /ForGIATest 를 못 찾는다.
location = /ForGIATest {
    return 301 /ForGIATest/;
}

# **`^~` 가 있어야 한다.** nginx 는 접두 location 보다 정규식을 먼저 보는데,
# 운영 조각의 `location ~* ^/(forgia)(/.*)?$` 가 대소문자를 안 가린다.
# 지금 그 정규식은 /ForGIATest/ 를 안 잡지만(뒤에 `/` 가 아닌 `Test` 가 온다),
# 저쪽 규칙이 느슨해지는 날 여기가 조용히 운영으로 301 되는 것을 막아 둔다.
location ^~ /ForGIATest/ {
    # **끝의 슬래시가 핵심이다.** 이것이 있어야 nginx 가 /ForGIATest/ 을 떼고
    # 넘긴다. Django 는 뿌리에 붙은 것처럼 해석하고, 링크를 만들 때만
    # FORCE_SCRIPT_NAME=/ForGIATest 을 앞에 붙인다(.env). 슬래시를 빼면 앱이
    # /ForGIATest/... 을 그대로 받아 전부 404 가 된다.
    proxy_pass http://127.0.0.1:8091/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 2752x2208 원본을 줄여 내보내는 요청이 있어 기본 60초로는 모자랄 때가 있다
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # 교정 저장(POST /review)은 폴리곤이 실려 커질 수 있다
    client_max_body_size 32m;

    proxy_buffering on;
}
